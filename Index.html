<!DOCTYPE html>
<html>
<head>
  <title>Don't Escape Box</title>
  <style>
    body { font-family: Arial; text-align: center; background: #111; color: white; }
    #room { margin-top: 30px; }
    .object {
      display: inline-block;
      margin: 20px;
      padding: 20px;
      background: #333;
      cursor: pointer;
      border-radius: 10px;
    }
    .object:hover {
      background: #555;
    }
    #inventory { margin-top: 20px; }
  </style>
</head>
<body>

<h1>Don't Escape Box</h1>
<p id="text">You wake up trapped. Look around and find a way out.</p>

<div id="room">
  <div class="object" onclick="checkBox()">📦 Box</div>
  <div class="object" onclick="checkPaper()">📄 Paper</div>
  <div class="object" onclick="checkDoor()">🚪 Door</div>
</div>

<div id="inventory">
  <h3>Inventory:</h3>
  <p id="items">Empty</p>
</div>

<script>
let hasKey = false;
let code = "123";

function checkBox() {
  if (!hasKey) {
    document.getElementById("text").innerText = "You found a small key.";
    hasKey = true;
    updateInventory();
  } else {
    document.getElementById("text").innerText = "The box is empty.";
  }
}

function checkPaper() {
  document.getElementById("text").innerText = "The paper reads: 'The code is 123'.";
}

function checkDoor() {
  if (!hasKey) {
    document.getElementById("text").innerText = "The door is locked.";
    return;
  }

  let input = prompt("Enter the code:");
  if (input === code) {
    document.getElementById("text").innerText = "You escaped successfully! 🎉";
  } else {
    document.getElementById("text").innerText = "Wrong code. Try again.";
  }
}

function updateInventory() {
  document.getElementById("items").innerText = hasKey ? "Key 🔑" : "Empty";
}
</script>

</body>
</html>
